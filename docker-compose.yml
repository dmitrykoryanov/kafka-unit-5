services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.4
    container_name: zookeeper
    # Без ZooKeeper брокеры не стартуют, поэтому после перезапуска Docker он должен подниматься сам
    restart: unless-stopped
    environment:
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
    networks:
      - kafka-network
    ports:
      - "2181:2181"
    volumes:
      - data-zookeeper-log1:/var/lib/zookeeper/log
      - data-zookeeper-data1:/var/lib/zookeeper/data
  kafka1:
    image: confluentinc/cp-kafka:7.4.4
    container_name: kafka1
    hostname: kafka1
    restart: on-failure
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # SSL — внутренний порт для обмена между брокерами, EXTERNAL — порт для клиентов с хоста
      KAFKA_ADVERTISED_LISTENERS: SSL://kafka1:9092,EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: SSL:SSL,EXTERNAL:SSL
      KAFKA_INTER_BROKER_LISTENER_NAME: SSL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
      KAFKA_DELETE_TOPIC_ENABLE: true
      KAFKA_LISTENERS: SSL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9093
      KAFKA_SSL_KEYSTORE_FILENAME: kafka1.keystore.jks
      KAFKA_SSL_KEYSTORE_CREDENTIALS: kafka1_keystore_creds
      KAFKA_SSL_KEY_CREDENTIALS: kafka1_sslkey_creds
      KAFKA_SSL_TRUSTSTORE_FILENAME: kafka.kafka1.truststore.jks
      KAFKA_SSL_TRUSTSTORE_CREDENTIALS: kafka1_truststore_creds
      KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: https
      KAFKA_SSL_CLIENT_AUTH: required
      KAFKA_AUTHORIZER_CLASS_NAME: kafka.security.authorizer.AclAuthorizer
      # Имя пользователя = CN клиентского сертификата (CN=producer -> User:producer); $$ — экранирование $ для docker compose
      KAFKA_SSL_PRINCIPAL_MAPPING_RULES: RULE:^CN=(.*?),.*$$/$$1/,DEFAULT
      KAFKA_SUPER_USERS: User:kafka1;User:kafka2;User:kafka3;User:admin
    networks:
      - kafka-network
    ports:
      - "9093:9093"
    volumes:
      - data-kafka1:/var/lib/kafka/data
      - ./kafka1-creds:/etc/kafka/secrets
      - ./admin-creds:/etc/kafka/admin:ro

  kafka2:
    image: confluentinc/cp-kafka:7.4.4
    container_name: kafka2
    hostname: kafka2
    restart: on-failure
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: SSL://kafka2:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: SSL:SSL,EXTERNAL:SSL
      KAFKA_INTER_BROKER_LISTENER_NAME: SSL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
      KAFKA_DELETE_TOPIC_ENABLE: true
      KAFKA_LISTENERS: SSL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094
      KAFKA_SSL_KEYSTORE_FILENAME: kafka2.keystore.jks
      KAFKA_SSL_KEYSTORE_CREDENTIALS: kafka2_keystore_creds
      KAFKA_SSL_KEY_CREDENTIALS: kafka2_sslkey_creds
      KAFKA_SSL_TRUSTSTORE_FILENAME: kafka.kafka2.truststore.jks
      KAFKA_SSL_TRUSTSTORE_CREDENTIALS: kafka2_truststore_creds
      KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: https
      KAFKA_SSL_CLIENT_AUTH: required
      KAFKA_AUTHORIZER_CLASS_NAME: kafka.security.authorizer.AclAuthorizer
      KAFKA_SSL_PRINCIPAL_MAPPING_RULES: RULE:^CN=(.*?),.*$$/$$1/,DEFAULT
      KAFKA_SUPER_USERS: User:kafka1;User:kafka2;User:kafka3;User:admin
    networks:
      - kafka-network
    ports:
      - "9094:9094"
    volumes:
      - data-kafka2:/var/lib/kafka/data
      - ./kafka2-creds:/etc/kafka/secrets
      - ./admin-creds:/etc/kafka/admin:ro

  kafka3:
    image: confluentinc/cp-kafka:7.4.4
    container_name: kafka3
    hostname: kafka3
    restart: on-failure
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: SSL://kafka3:9092,EXTERNAL://localhost:9095
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: SSL:SSL,EXTERNAL:SSL
      KAFKA_INTER_BROKER_LISTENER_NAME: SSL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
      KAFKA_DELETE_TOPIC_ENABLE: true
      KAFKA_LISTENERS: SSL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9095
      KAFKA_SSL_KEYSTORE_FILENAME: kafka3.keystore.jks
      KAFKA_SSL_KEYSTORE_CREDENTIALS: kafka3_keystore_creds
      KAFKA_SSL_KEY_CREDENTIALS: kafka3_sslkey_creds
      KAFKA_SSL_TRUSTSTORE_FILENAME: kafka.kafka3.truststore.jks
      KAFKA_SSL_TRUSTSTORE_CREDENTIALS: kafka3_truststore_creds
      KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: https
      KAFKA_SSL_CLIENT_AUTH: required
      KAFKA_AUTHORIZER_CLASS_NAME: kafka.security.authorizer.AclAuthorizer
      KAFKA_SSL_PRINCIPAL_MAPPING_RULES: RULE:^CN=(.*?),.*$$/$$1/,DEFAULT
      KAFKA_SUPER_USERS: User:kafka1;User:kafka2;User:kafka3;User:admin
    networks:
      - kafka-network
    ports:
      - "9095:9095"
    volumes:
      - data-kafka3:/var/lib/kafka/data
      - ./kafka3-creds:/etc/kafka/secrets
      - ./admin-creds:/etc/kafka/admin:ro

volumes:
  data-zookeeper-log1:
  data-zookeeper-data1:
  data-kafka1:
  data-kafka2:
  data-kafka3:

networks:
  kafka-network:
    driver: bridge
