spring.application.name=kafka-ssl

# Внешние SSL-порты брокеров; пути к хранилищам относительно корня проекта (рабочего каталога)
spring.kafka.bootstrap-servers=localhost:9093,localhost:9094,localhost:9095
spring.kafka.security.protocol=SSL

# Администратор (User:admin, суперпользователь) — создаёт топики при старте; без брокеров приложение не запустится
spring.kafka.admin.fail-fast=true
spring.kafka.admin.ssl.key-store-location=file:admin-creds/admin.keystore.jks
spring.kafka.admin.ssl.key-store-password=your-password
spring.kafka.admin.ssl.key-password=your-password
spring.kafka.admin.ssl.trust-store-location=file:admin-creds/admin.truststore.jks
spring.kafka.admin.ssl.trust-store-password=your-password

# Продюсер (User:producer) — Write и Describe на topic-1 и topic-2
spring.kafka.producer.ssl.key-store-location=file:producer-creds/producer.keystore.jks
spring.kafka.producer.ssl.key-store-password=your-password
spring.kafka.producer.ssl.key-password=your-password
spring.kafka.producer.ssl.trust-store-location=file:producer-creds/producer.truststore.jks
spring.kafka.producer.ssl.trust-store-password=your-password

# Консьюмер (User:consumer) — Read и Describe на topic-1, чтение topic-2 запрещено
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.ssl.key-store-location=file:consumer-creds/consumer.keystore.jks
spring.kafka.consumer.ssl.key-store-password=your-password
spring.kafka.consumer.ssl.key-password=your-password
spring.kafka.consumer.ssl.trust-store-location=file:consumer-creds/consumer.truststore.jks
spring.kafka.consumer.ssl.trust-store-password=your-password

# Убираем INFO-шум клиентов Kafka (дампы конфигурации), предупреждения и ошибки остаются
logging.level.org.apache.kafka=WARN
